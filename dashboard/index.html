<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Dashboard - Razznama</title>
    <style>
        :root {
            --bg-dark: #0f1117;
            --bg-card: #181b24;
            --accent-gold: #e5a93c;
            --accent-crimson: #c93b3b;
            --text-main: #f0f2f5;
            --text-muted: #9ba1b0;
            --border-color: #262b3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            transition: 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-main);
            border-color: var(--accent-gold);
        }

        main {
            flex: 1;
            padding: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .card-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--accent-gold);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .series-list {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .series-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .series-item:last-child {
            border-bottom: none;
        }

        .series-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .series-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(229, 169, 60, 0.15);
            color: var(--accent-gold);
        }

        .btn-action {
            background-color: var(--accent-gold);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="brand-title">RAZZNAMA CREATOR</a>
        <a href="../index.html" class="back-link">← Public Site</a>
    </header>

    <main>
        <h1 class="page-title">Creator Overview</h1>

        <div class="grid">
            <div class="card">
                <div class="card-header">Active Series</div>
                <div class="stat-number">1</div>
                <div class="stat-desc">Divine Ascent</div>
            </div>
            <div class="card">
                <div class="card-header">Total Chapters</div>
                <div class="stat-number">2</div>
                <div class="stat-desc">Chapters 1 & 2 published</div>
            </div>
            <div class="card">
                <div class="card-header">Publishing Status</div>
                <div class="stat-number">Online</div>
                <div class="stat-desc">GitHub Pages Ready</div>
            </div>
        </div>

        <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">My Series Library</h2>
        <div class="series-list">
            <div class="series-item">
                <div>
                    <div class="series-name">Divine Ascent <span class="badge">Active</span></div>
                    <div class="series-meta">Fantasy · Action · Cultivation · 2 Chapters</div>
                </div>
                <div>
                    <a href="../series/divine-ascent/chapter-01.html" class="btn-action">View Reader</a>
                </div>
            </div>
        </div>
    </main>
</body>
  </html>
